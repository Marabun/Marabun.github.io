name: build-index
on:
  push:
    paths:
      - 'parts/**'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build index.html from b64 parts
        run: |
          set -euo pipefail
          : > index.html
          for i in 00 01 02 03 04 05 06 07 08 09 10 11; do
            base64 -d "parts/p${i}.b64" >> index.html
          done
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Rebuild index.html from b64 parts" && git push)
