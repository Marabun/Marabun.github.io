name: build-index
on:
  push:
    paths:
      - 'parts/**'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build index.html from article fragments
        run: |
          set -euo pipefail
          test -f parts/head.html
          test -f parts/tail.html
          test -f parts/a00.html
          test -f parts/a38.html
          cat parts/head.html parts/a*.html parts/tail.html > index.html
          wc -c index.html
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Rebuild index.html from article fragments" && git push)
